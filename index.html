<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFFアプリ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="font-family: sans-serif; padding: 24px; background: #f7f7f7;">

  <div style="background: white; padding: 20px; border-radius: 16px; text-align: center;">
    <h2>LIFF同期テスト</h2>
    <p id="status">LIFF初期化中...</p>
    <h1 id="welcome"></h1>
  </div>

  <script>
    // ⚠️【あなたの環境に合わせて書き換えてください】⚠️
    const LIFF_ID = "2010148048-G6yKJqoU"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby2fE29QTvfT4rrB533G9PbiUYv9z1vk8pIoRedXLfl72tkNPcJj5OfrgrWeiLnfJh5Bw/exec"; 

    async function initializeLiff() {
      const statusEl = document.getElementById("status");
      const welcomeEl = document.getElementById("welcome");

      try {
        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return; 
        }

        statusEl.textContent = "ユーザー情報取得中...";
        const profile = await liff.getProfile();
        welcomeEl.textContent = `こんにちは、${profile.displayName} さん！`;

        // 🚀 ここで裏側からGAS（API）にデータを送信します！
        statusEl.textContent = "データをスプレッドシートに同期中...";
        
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors", // GASのリダイレクトバグを完全に回避する魔法の設定
          headers: {
            "Content-Type": "text/plain" 
          },
          body: JSON.stringify({
            userId: profile.userId,
            displayName: profile.displayName,
            pictureUrl: profile.pictureUrl
          })
        });

        if (response) {
          statusEl.textContent = "同期が完了しました！シートを確認してください。";
        }

      } catch (error) {
        console.error("エラー:", error);
        statusEl.textContent = "エラーが発生しました。";
      }
    }

    window.addEventListener("DOMContentLoaded", initializeLiff);
  </script>
</body>
</html>
